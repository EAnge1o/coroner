# Optional: run Ollama in Docker instead of installing it natively.
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5-coder:7b
# Then set OLLAMA_ENDPOINT=http://localhost:11434 in .env (already the default).
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
